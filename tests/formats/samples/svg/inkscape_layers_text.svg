<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Hand-written test file in the style of an Inkscape drawing. -->
<svg
   width="210mm"
   height="100mm"
   viewBox="0 0 210 100"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     inkscape:document-units="mm" />
  <defs
     id="defs1">
    <marker
       style="overflow:visible"
       id="Arrow"
       orient="auto-start-reverse">
      <path
         style="fill:context-stroke"
         d="M 0,0 5,2.5 0,5 Z" />
    </marker>
  </defs>
  <g
     inkscape:label="Background"
     inkscape:groupmode="layer"
     id="layer1">
    <rect
       style="fill:#ffcc00;stroke:none"
       id="rect1"
       width="40"
       height="20"
       x="10"
       y="10"
       rx="3" />
    <path
       style="fill:#000000;fill-rule:evenodd;stroke:none"
       d="M 60,10 H 100 V 50 H 60 Z M 70,20 H 90 V 40 H 70 Z"
       id="path1" />
  </g>
  <g
     inkscape:label="Text"
     inkscape:groupmode="layer"
     id="layer2">
    <text
       xml:space="preserve"
       style="font-size:8px;text-anchor:middle;fill:#333333"
       x="105"
       y="70"
       id="text1"><tspan
         sodipodi:role="line"
         id="tspan1"
         x="105"
         y="70">First line</tspan><tspan
         sodipodi:role="line"
         id="tspan2"
         x="105"
         y="80">Second line</tspan></text>
    <text
       style="font-size:10px;fill:#000000"
       x="10"
       y="90"
       id="text2">Label<tspan
         x="10"
         dy="1.2em"
         id="tspan3">below</tspan></text>
  </g>
  <g
     inkscape:label="Effects"
     inkscape:groupmode="layer"
     id="layer3"
     style="display:none">
    <g
       style="opacity:0.5"
       id="g1">
      <rect
         style="fill:#ff0000"
         width="10"
         height="10"
         x="150"
         y="10" />
      <rect
         style="fill:#0000ff"
         width="10"
         height="10"
         x="155"
         y="15" />
    </g>
    <path
       style="fill:none;stroke:#000000;stroke-width:0.5;marker-end:url(#Arrow)"
       d="M 150,40 H 190"
       id="path2" />
  </g>
</svg>
