[project]
name = "presstoshape"
version = "0.1.0"
description = "Open-source vector drawing application for artists"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6-essentials==6.12.0",
    "skia-pathops==0.9.2",
    "skia-python==144.0.post2",
    "svgelements==1.9.6",
]

[dependency-groups]
build = [
    "pillow>=13.0.0",
    "pyinstaller==6.22.3",
]
dev = [
    "numpy>=2.5.4",
    "pytablericons>=1.0.1",
    "pytest>=9.1.1",
    "resvg-py==0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Test modules mirror the package layout and may share basenames (tests/render/test_paths.py, ...).
addopts = ["--import-mode=importlib"]
