[project]
name = "veccy"
version = "0.1.0"
description = "Open-source vector drawing application for artists"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6-essentials==6.12.0",
    "skia-pathops==0.9.2",
    "svgelements==1.9.6",
]

[dependency-groups]
dev = [
    "pytablericons>=1.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
